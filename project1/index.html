<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POKEMON GEN I</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="outer-box">
      <div class="left-box">
        <div class="left-box-logo">
          <img src="./images/pokemon.webp" alt="logo" />
        </div>
        <div class="left-box-center">
          <span>POKEMON GEN I</span>
          <h1>Pikachu</h1>
          <p>
            Pikachu is an Electric-type Pokemon introduced <br />
            in Generation I. Pikachu are small, chubby, <br />
            and incredibly cute mouse-like Pokemon. <br />
            They are almost completly covered by <br />
            yellow fur.
          </p>
          <h3><span></span> 01&nbsp;&nbsp;/&nbsp;08</h3>
        </div>
        <div class="left-box-bottom-icon">
            <i class="ri-steering-2-line"></i>
        </div>
      </div>
      <div class="right-box">
        <div class="right-box-hamburger">
            <i class="ri-menu-line"></i>
        </div>
        <div class="right-box-center">
            <div class="right-box-dots">
                <span class="right-box-dot"></span>
                <span class="right-box-dot"></span>
                <span class="right-box-dot"></span>
                <span class="right-box-dot"></span>
                <span class="right-box-dot"></span>
            </div>
        </div>
      </div>
      <img src="./images/pikachu.png" alt="pikachu" class="center-image">
    </div>
  </body>
</html>
